<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Yakshith</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        input, textarea {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-family: inherit;
            transition: var(--transition-smooth);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--glass-hover);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--glass-hover);
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">YAKSHITH</div>
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-links" id="nav-links">
            <a href="./">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="education.html">Education</a>
            <a href="skills.html">Skills</a>
            <a href="certifications.html">Certifications</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main class="container">
        <canvas id="hero-canvas" class="live-bg-canvas"></canvas>
        <header class="section-header reveal">
            <div class="glass-pill">Get in Touch</div>
            <h2>Let's Create Magic Together</h2>
            <p>I'm always open to discussing new projects, creative ideas, or opportunities to be part of your vision.</p>
        </header>

        <section class="bento-card reveal" style="max-width: 600px; margin: 0 auto;">
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Yakshith" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="google@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Your message here..." required></textarea>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <span class="btn-text">Send Message</span>
                    <div class="loader" style="display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                </button>
            </form>

            <div id="form-status" style="display: none; text-align: center; margin-top: 20px;">
                <div class="glass-pill" style="background: rgba(34, 197, 94, 0.1); border-color: #22c55e; color: #22c55e; padding: 10px 20px;">
                    Message sent successfully! ✨
                </div>
            </div>
        </section>

        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>

        <footer class="reveal">
            <div>© 2026 Yakshith. All rights reserved.</div>
            <ul class="social-list">
                <li><a href="https://www.linkedin.com/in/yakshithreddy/" target="_blank" title="LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg></a></li>
                <li><a href="https://github.com/yakshithmekala" target="_blank" title="GitHub"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg></a></li>
                <li><a href="mailto:yakshithreddym@gmail.com" title="Email"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></a></li>
            </ul>
        </footer>
    </main>

    <script type="module" src="src/main.js"></script>
    <script type="module">
        import { gsap } from 'gsap';

        const form = document.getElementById('contact-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = submitBtn.querySelector('.btn-text');
        const loader = submitBtn.querySelector('.loader');
        const status = document.getElementById('form-status');

        // Formspree ID provided by user
        const FORMSPREE_ID = 'xgonkaog'; 

        form?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            submitBtn.disabled = true;
            btnText.textContent = 'Sending...';
            loader.style.display = 'block';
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Success Animation
                    gsap.to(form, { opacity: 0, scale: 0.9, duration: 0.5, onComplete: () => {
                        form.style.display = 'none';
                        status.style.display = 'block';
                        gsap.fromTo(status, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: 'back.out(1.7)' });
                    }});
                } else {
                    throw new Error('Failed to send');
                }
            } catch (error) {
                alert('Oops! There was a problem sending your message. Please try again.');
                submitBtn.disabled = false;
                btnText.textContent = 'Send Message';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>

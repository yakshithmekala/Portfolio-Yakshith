    <link rel="stylesheet" href="src/style.css">
    <style>
        .certifications-header {
            max-width: 760px;
            margin-bottom: 36px;
        }
        .certifications-game {
            max-width: 920px;
            margin: 0 auto;
        }
        .certifications-game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        .certifications-game-label {
            color: var(--accent-secondary);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .certifications-game-status {
            color: var(--text-secondary);
            font-size: 0.92rem;
        }
        .certifications-puzzle {
            position: relative;
            width: min(100%, 760px);
            margin: 0 auto;
            aspect-ratio: 1;
            background: transparent;
            border: none;
            box-shadow: none;
            overflow: visible;
        }
        .cert-segment {
            position: absolute;
            inset: 0;
            border: none;
            padding: 0;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.018));
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: filter 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }
        .cert-segment:hover,
        .cert-segment:focus-visible {
            filter: brightness(1.08);
            box-shadow:
                inset 0 0 0 1px rgba(255, 174, 143, 0.42),
                inset 0 0 28px rgba(255, 255, 255, 0.03);
            outline: none;
        }
        .cert-segment.is-revealed {
            background:
                linear-gradient(180deg, var(--segment-top), var(--segment-bottom));
            box-shadow:
                inset 0 0 0 1px var(--segment-border),
                inset 0 0 40px rgba(255, 255, 255, 0.02);
            cursor: default;
        }
        .cert-segment__content {
            position: absolute;
            left: var(--content-x);
            top: var(--content-y);
            transform: translate(-50%, -50%);
            width: min(168px, 24vw);
            text-align: center;
            pointer-events: auto;
        }
        .cert-segment__title {
            font-size: clamp(0.82rem, 1.35vw, 1rem);
            font-weight: 700;
            line-height: 1.18;
            letter-spacing: -0.02em;
        }
        .cert-segment__issuer {
            margin-top: 7px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.74rem;
            line-height: 1.35;
        }
        .cert-segment__verify {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.72rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition-smooth);
        }
        .cert-segment__verify:hover {
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.12);
        }
        .cert-puzzle-hub {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            clip-path: polygon(var(--hub-points));
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 55%),
                rgba(8, 8, 8, 0.88);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        .cert-puzzle-hub.is-complete {
            background:
                radial-gradient(circle at top left, rgba(255, 200, 164, 0.14), transparent 55%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.025));
        }
        .cert-puzzle-hub__content {
            width: min(180px, 32vw);
            text-align: center;
        }
        .cert-puzzle-hub__eyebrow {
            color: var(--accent-secondary);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .cert-puzzle-hub__title {
            margin-top: 8px;
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: 700;
            line-height: 1.12;
            letter-spacing: -0.03em;
        }
        .cert-puzzle-hub__meta {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.45;
        }
        @media (max-width: 768px) {
            .certifications-header {
                margin-bottom: 28px;
            }
            .certifications-game-meta {
                flex-direction: column;
                align-items: flex-start;
                margin-bottom: 14px;
            }
            .cert-segment__content {
                width: min(118px, 28vw);
            }
            .cert-segment__title {
                font-size: 0.72rem;
            }
            .cert-segment__issuer {
                font-size: 0.64rem;
            }
            .cert-segment__verify {
                min-height: 26px;
                margin-top: 8px;
                padding: 5px 10px;
                font-size: 0.65rem;
            }
            .cert-puzzle-hub__content {
                width: min(122px, 28vw);
            }
            .cert-puzzle-hub__eyebrow {
                font-size: 0.62rem;
            }
            .cert-puzzle-hub__title {
                font-size: 0.92rem;
            }
            .cert-puzzle-hub__meta {
                font-size: 0.66rem;
            }
        }
    </style>
